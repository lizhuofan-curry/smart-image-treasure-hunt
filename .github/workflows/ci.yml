name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: Syntax and required file checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: >-
          python -m compileall -q common image_classification image_denoising
          image_similarity web
      - name: Verify required project files
        run: |
          test -f README.md
          test -f requirements.txt
          test -f common/fashion-labels.csv
          test -f web/web_app.py
          test -f image_classification/classifier.pth
          test -f image_denoising/denoiser.pth
          test -f image_similarity/encoder.pth
          test -f image_similarity/decoder.pth
          test -f image_similarity/embeddings.npy
